# ============================================================================
# simulation.toml — 模擬器的「唯一真實來源」設定檔
#
# 這是你要自行修改參數的地方。所有 key 名稱與 config.py 的 SimulationConfig /
# UIConfig 欄位完全對應；分區只是為了好讀。改完存檔、重啟伺服器即生效
# （前端 slider 範圍也由本檔的 [ui] 區下發，不必另改 HTML/JS）。
#
# 缺少的 key 會自動回退到 config.py 內的程式碼預設值；整個檔不存在也能正常跑。
# 數值/語意對齊 gama_moudle/Traffic_ABM_LLM_complete_v2.gaml 的 global [可調整參數區]。
#
# 註：本檔只管「模擬模型參數」。LLM 的「連線設定」（Ollama/vLLM 的 URL、後端、endpoint 模型）
#     刻意放在 .env（隨機器變、不進 repo），由 src/llm_server/llm_config.py 讀取——兩者不重疊。
# ============================================================================

# ----- 模擬時間 -----
[time]
max_steps = 60          # 總週期數（GAML max_steps）
step_minutes = 1        # 每週期代表幾分鐘（GAML step_minutes）

# ----- agent 規模與起訖 -----
[agents]
nb_agents = 0                      # 預設 agent 數（前端可在 [ui] 範圍內覆寫）
destination_town_name = "安定區"     # 球場 point 載入失敗時的 fallback 終點
default_origin_town = "東區"         # 解析失敗時的 fallback 生成行政區
county_name = "臺南市"

# ----- 感知 / 移動 / 抵達 -----
[perception]
perception_radius_m = 300.0             # 感知半徑（公尺）
arrival_distance_threshold_m = 100      # 抵達判定容差（公尺）；⚠ 僅 legacy 引擎用，UXsim 不吃（抵達=走到終點節點）
arrival_radius_m = 600                   # 球場「抵達圈」半徑（公尺）：事件車終點分散到圈內離出發地最近的節點
                                         # （周邊停車場/入口，解單點 funnel）；前端以半透明灰圈顯示。圈內無節點→回退單一球場節點
arrival_gates_per_car = 5                # 抵達圈分流：從「最近 K 個」節點中挑一個（解同方向車擠單點）；1=只挑最近(舊行為)
arrival_on_circle_entry = true           # 踏進抵達圈即算抵達 + 把車移出路網（解終點前 sink 回堵；agent 仍留畫面）；false=走到節點才算
crowded_speed_factor = 0.55             # 壅塞時速度乘數（越小降越多）
missing_road_speed_cap_kmh = 60.0       # 無速限資料路段的速度上限
crowded_road_threshold = 0.6            # congestion_proxy ≥ 此值視為壅塞 / 觸發重算路徑
nearby_mode = "grid"                    # 鄰近車數估法：grid（空間網格近似、O(n)，大規模用）| exact（精確全比對、O(n²)）
town_mode = "node"                      # current_town 估法：node（所在節點所屬區、O(1)，大規模用）| exact（精確位置、O(車數×區數)）

# ----- 預設移動偏好（每個 agent 的初始 action_mode 權重）-----
# 註：time/distance/comfort/capacity 為路徑規劃權重，數值相對大小決定取向。
[movement]
default_vehicle_type = "汽車"            # "汽車" 或 "機車"
default_desired_speed_kmh = 40.0        # agent 期望速度
default_speed_car_kmh = 45.0            # 汽車偏好速度
default_speed_moto_kmh = 35.0           # 機車偏好速度
default_route_randomness = 0.15
default_comfort_weight = 0.20
default_time_weight = 0.45
default_distance_weight = 0.25
default_capacity_weight = 0.10
default_road_type_preference = ["primary", "secondary", "tertiary", "residential"]

# ----- 三種 action_mode 的數值 + 路徑策略 -----
# 每個 mode 一組權重（time/distance/comfort/capacity，相對大小決定路徑取向）+ 策略旗標。
# 策略旗標讓每個 mode 走出不同的路徑選擇方式（詳見 docs/ACTION_MODES_zh-TW.md）：
#   congestion_penalty   額外壅塞懲罰倍率，成本 ×(1 + penalty×congestion)；0=不額外懲罰
#   avoid_threshold      congestion_proxy > 此值的邊近乎封路（硬避開）；≥1=停用（proxy 上限 1）
#   road_class_bias      >0：幹道打折、小路加罰（偏好大路）；0=不分路型
#   recompute_on_crowded 壅塞時是否重算路徑；false=路徑定了走到底
#   route_randomness     每邊成本隨機微擾 ±值（seeded、可重現），用來分散車流
# mock/LLM 只需回 mode 名字，套用時會自動帶入下列數值與策略。

[action_modes.fast]              # 最短時間：無視壅塞，走自由流最快路線
desired_speed_kmh = 100.0
time_weight = 0.70
distance_weight = 0.20
comfort_weight = 0.05
capacity_weight = 0.05
route_randomness = 0.05

[action_modes.tolerate_congestion]   # 時間優先但不繞路：塞了也走到底
desired_speed_kmh = 80.0
time_weight = 0.55
distance_weight = 0.30
comfort_weight = 0.10
capacity_weight = 0.05
recompute_on_crowded = false
route_randomness = 0.05

[action_modes.avoid_congestion]  # 避塞：壅塞重罰 + 硬避開高壅塞邊 + 積極重算 + 高隨機分散
desired_speed_kmh = 80.0
time_weight = 0.20
distance_weight = 0.10
comfort_weight = 0.25
capacity_weight = 0.45
congestion_penalty = 3.0
avoid_threshold = 0.6
route_randomness = 0.20


# ----- 道路壅塞估計與權重 -----
[roads]
active_road_min_flow = 1                 # flow ≥ 此值算「使用中道路」
road_flow_high_threshold = 8             # 視覺化：紅色門檻
road_flow_medium_threshold = 3           # 視覺化：橘色門檻

# ----- 決策核心（事件車）-----
# 兩個可選決策核心（前端可切換；登錄於 decisions/registry.py）：
#   規則式（rule）：確定性啟發式核心，零 LLM 成本、作對照基線。
#   LLM 認知核心（llm）：本進程直呼 llm_server pipeline（run_perception / run_decision_making），需 Ollama/vLLM。
# 注意：背景常態車流（[ambient]）一律走規則式核心，不受此設定影響。
[llm]
use_llm = true               # true＝LLM 核心（demo 預設；前端規則式按鈕已暗掉）。規則式仍是 LLM 失敗時的自動 fallback、背景車核心、paper baseline

# ----- 旅次記憶（單一 memory；不再分長短期）-----
# 記憶已合併為單一 memory（1 step=1 分鐘，長短期區分無意義）。這裡是把每步量化感知轉成
# 「人類印象」質性標籤時用的門檻。詳見 docs/MEMORY_zh-TW.md。
# 標籤文字（順暢/普通/壅塞…）是設計常數、與 prompt 語意綁定，定義在 domain/agent.py。
[memory]
feel_congested_proxy = 0.6   # 當步 congestion_proxy ≥ 此值（或被判定壅塞）→「壅塞」
feel_normal_proxy = 0.3      # ≥ 此值 →「普通」；否則「順暢」
moved_stalled_kmh = 5.0      # 有效速度（實際位移÷週期時間）< 此值 km/h →「停滯」（與每週期分鐘無關）
moved_slow_kmh = 15.0        # < 此值 →「緩慢」；否則「前進中」
smoothness_rough_proxy = 0.6 # 整趟平均 congestion_proxy ≥ 此值 →「不順」
smoothness_mid_proxy = 0.3   # ≥ 此值 →「中等」；否則「順暢」
congested_spots_max = 5      # 記憶中最多保留幾個塞過的地點
distance_decimals = 1        # remaining 距離顯示小數位數

# ----- 送 LLM 的環境感知（全域熱點 / 每車前方路況）-----
# 讓 LLM 真正看懂環境，同時控制 max context。詳見 docs/ENVIRONMENT_zh-TW.md。
# 質性門檻（順暢/普通/壅塞）沿用上面 [memory] 的 feel_*，保持同一套詞彙。
[perception_context]
hotspots_top_k = 5            # 全域 congestion_hotspots 取前幾個最塞的行政區（不乘 agent 數）
lookahead_distance_m = 500  # 每車 road_ahead 沿路徑往前看的距離（公尺）
speed_free_ratio = 0.8       # speed/速限 ≥ 此值 →「自由流」
speed_slow_ratio = 0.5       # ≥ 此值 →「略慢」；否則「壅塞緩行」

# ----- agent persona 原型池 -----
# pool_size 是「原型數上限」（人物範本數），與模擬車數（nb_agents）分離：生成一次、存成穩定池檔、
# 分批生成（每批數量依輸出預算自動推算、每批不同 seed、沿用 [scaling].concurrency 並行）。
# 模擬車數超過 pool_size 時會循環重複套用原型（pool[i % len]），不會為了車多而生更多 persona。
# 數量決定首次建池要呼叫幾次 LLM、生成多久（500 約 20 次呼叫）；之後重用、不重生。
# 要整批換人用前端「重新生成人物」按鈕。詳見 docs/PYTHON_SIMULATOR_zh-TW.md。
[profile]
pool_size = 500                 # persona 原型數上限（建議數百；車多時循環重用，不再 1 車 1 persona）

# ----- 規模化（LLM 決策的事件觸發 + 並行批次）-----
# 純事件觸發：LLM 模式下只在踩到壅塞/前方塞時才重決 action_mode；順暢的車維持規則式初始 mode。
# 詳見 docs/SCALING_zh-TW.md。
[scaling]
event_triggered_decisions = true   # 關閉＝退回「每步對全部 agent 決策」舊行為
cooldown_minutes = 10              # LLM 決策 cooldown：同車幾「模擬分鐘」內不重決（與 step_minutes 無關）
reroute_cooldown_minutes = 10      # 重算路徑 cooldown：同車幾「模擬分鐘」內不重算路徑
batch_size = 100                    # 每批最多幾個 agent（上限；實際會被 [llm_budget] 的 token 預算再壓低）
concurrency = 96                    # 同時並行幾批
# ----- 引擎初始化效能（皆不改模擬結果；可關閉以對拍驗證）-----
cache_network = true               # 跨連線/重設快取已解析的 graphml 圖+節點索引（省 24MB 重解析）
init_workers = 16                   # init 路由並行程序數（0/1=單程序；>1 才開 multiprocessing。Linux 受益最大）
parallel_init_min_agents = 200     # 車數達此門檻才啟用並行 init（量少時 pool 啟動成本不划算）
route_trees = true                  # 用「反向終點樹」做路由（init + 中途重算）；false=退回逐車 find_path（對照/除錯）。
# ⚠ 終點樹「會改結果」：同 mode+終點走相同(當前壅塞下)最短路(無 per-car jitter)、背景車終點收斂到區代表節點；
#   含當前壅塞 + avoid_circles 權重,與 find_path 等價(只差 jitter)。把每步重算從上萬次 networkx 降到數十棵樹。
profile_steps = true                # 每步分段計時：印一行 decide/move(reroute)/flow/perceive/detect/snap 耗時。純量測、不改結果。

# ----- LLM token 預算（依預算動態切批，避免 prompt 溢位 vLLM context）-----
# 每批 decision prompt ≈ prompt_overhead + batch×(每 agent status+persona) + 輸出。
# 引擎據此反推「安全 batch」（不超過 [scaling].batch_size），讓 prompt 不超過 max_model_len。
# 用 `python -m llm_abm_simulator.calibrate` 量你的實際 token 並取得建議值。詳見 docs/CHANGES_LLM_PIPELINE_zh-TW.md。
[llm_budget]
max_model_len = 8192          # 對齊 vLLM --max-model-len：單次請求 prompt+輸出 token 上限
reserve_output_tokens = 1024  # 為輸出保留的 token
prompt_overhead_tokens = 800  # 模板+全域等固定開銷估計（token）
chars_per_token = 2.0         # 中英混 JSON「字元→token」粗估比（保守）

# ----- 事件需求生成（出生地由重力模型依人口+距離衰減分配）-----
# 生產約束重力模型：T_i ∝ 人口_i × f(到場館距離)。取代「由 persona residential_location 決定出生地」。
# 人口來源：data/gis/town_population.csv。enabled=false 或無人口資料 → 回退既有出生地指派。
# beta 越大越集中在近場館的區；前端之後會做成 slider。詳見 docs/DEMAND_zh-TW.md。
[demand]
enabled = true       # 是否用重力模型決定出生地
beta = 0.08          # 距離衰減係數（exp(−beta·d_km)）
decay = "exp"        # "exp" 指數 / "power" 冪次（d_km^(−beta)）
min_distance_km = 0.5  # 距離下限，避免場館同區距離→0 權重爆掉
dest_pool_per_capita = 1000  # 稀疏終點：每區取 ceil(人口/此值) 個不重複隨機節點當終點池（全市約數百~千個終點）；
                             # 搭配 [uxsim].sparse_route_search 大幅加速 DUO 選路。0/負=停用（終點可為區內任一節點）

# ----- 背景常態交通流（ambient）-----
# 在「去事件地點的事件車流」之外，注入不指定事件終點的常態背景車，讓路網有真實基礎負載
# （事件車感知到的壅塞才有意義）。起訖以雙邊重力 OD（鄉鎮對；起點∝人口、終點∝人口×距離衰減，
# 沿用 [demand].beta/decay）抽樣，一律走規則式核心、不存記憶，抵達後換新 OD 重生 → 穩態背景負載。
# 最終分析會把背景＋事件車一起納入「路網層」交評。前端 slider 可即時調整數量（0＝關閉）。
# 無人口資料（data/gis/town_population.csv 全 0）→ 自動停用。詳見 docs/AMBIENT_zh-TW.md。
[ambient]
enabled = true       # 是否注入背景常態車流
count = 0           # 穩態背景車數（前端 slider 可在 0..max_count 覆寫）；初始化要為每台算路徑，越大開場越久
respawn = true       # 抵達後以新 OD 重生，維持穩態（false＝抵達即停）
max_count = 100000      # 前端/介入可設的背景車上限（保護效能；數百台時開場/重設較久）

# ----- 事件車分批出發（時空需求）-----
# 真實事件是陸續抵達。每台事件車在 departure_cycle 前「尚未進場」（不動/不算流量/不顯示），到點才跑。
# 出發時間在 [0, 視窗] 內依 profile 抽樣（seeded）。window_minutes=0 → 全部同時出發（＝舊行為）。
# 背景車不分批。詳見 docs/DEMO_FEATURES_zh-TW.md。
[departure]
window_minutes = 30      # 出發視窗（分鐘）；0＝全部同時出發
profile = "uniform"     # uniform（均勻）/ front_loaded（早到多）/ peak（接近開賽尖峰多）

# ----- 散場（egress）疏運評估 -----
# 單次模擬：進場（origin→球場）+ 散場（球場→回家）。手動觸發：前端按「宣告散場」後，
# 已抵達的事件車在 window_minutes 內依 profile 錯開離場、回 destination 指定的家（seeded、可重現）。
# 散場分析：疏散曲線、散場旅時、散場 OD、清場時間、進場 vs 散場對照。詳見 docs/EGRESS_zh-TW.md。
[egress]
destination = "residence"   # residence（回居住地；persona→對不到/規則式車則人口加權抽）| origin（回出生地，來回程）
window_minutes = 5          # 宣告散場後的錯開視窗（分鐘）
profile = "peak"            # peak（一窩蜂，最前面密集，最貼近真實散場洪峰）| uniform | gradual

# ----- 可重現性 -----
[reproducibility]
seed = 42                    # 同 seed → 同軌跡

# ----- 路網來源 -----
[network]
allow_osm_download = true    # bundle 路網不存在時是否嘗試用 OSMnx 即時下載
synthetic_grid_size = 12     # synthetic fallback 網格邊長節點數

# ----- 紅綠燈號誌（方向相位：一次只放行一個路軸）-----
# 號誌節點/相位軸/offset 由 data/tainan_signals.json 提供（執行 build_signals 產生）。
# ⚠ 台南無真實時相秒數，cycle_s / yellow_s 為合成值（改這裡即時生效，不需重建 artifact）。
# 停用或 artifact 不存在 → 引擎行為等同無號誌（不影響既有車流模擬）。詳見 spatial/signals.py。
[signals]
enabled = true       # 是否啟用號誌停等
cycle_s = 90.0       # 號誌週期秒（兩相位各約一半）
yellow_s = 3.0       # 每相位末尾黃燈/清道秒（此段兩組皆紅）

# ----- 前端控制範圍（同時驅動後端 clamp 與前端 slider）-----
[ui]
speed_min = 0.5              # 播放速度倍率下限
speed_max = 5.0             # 播放速度倍率上限
speed_step = 0.5
speed_default = 1.0
agents_min = 5              # agent 數下限
agents_max = 25000           # agent 數上限（同時是後端 clamp 上限）
agents_step = 5
# 大規模渲染：車數 ≤ render_individual_max → 逐台送/畫（任何 zoom）；超過 → 依 zoom/可視範圍裁切。
# zoom < agent_min_zoom 時只顯示道路壅塞、不送/不畫車（前端 zoom 進去才看到範圍內車流）。
render_individual_max = 1500
agent_min_zoom = 14
queue_render = true   # 等紅燈車「顯示用排隊」：沿進場道往後依車距(~7m)錯開（只改畫面、不動物理；false=回到停在路口同點）
# 時間控制（前端可調「跑幾個週期 / 每週期幾分鐘」；改了需重設）
steps_min = 6
steps_max = 240
steps_step = 6
step_minutes_options = [1, 2, 5, 10]

# ----- 各 OSM highway 型別的速限 / 車道 / 每車道容量 -----
# ⚠ 註：speed_car/speed_moto/lanes 在「重建路網」時烤進每條邊（建網時優先用 OSM 真實 maxspeed/lanes，
#    缺值才回退本表）；改值後需執行：
#        python -m llm_abm_simulator.spatial.build_roads            （OSM）
#        python -m llm_abm_simulator.spatial.build_roads --synthetic（合成）
# 註：speed_car/speed_moto/lanes 在「下載建 graphml」時烤進邊（改了要重建 graphml）。
# 容量已不在此設定：UXsim 後端由基本圖（speed×jam_density×lanes）決定容量、congestion_proxy 用
# jam 儲容（kappa×length）→ 見 [uxsim].jam_density。已移除 capacity_per_lane。
[highway_specs.motorway]
speed_car = 100
speed_moto = 80
lanes = 3

[highway_specs.trunk]
speed_car = 100
speed_moto = 80
lanes = 2

[highway_specs.primary]
speed_car = 70
speed_moto = 70
lanes = 2

[highway_specs.secondary]
speed_car = 60
speed_moto = 60
lanes = 2

[highway_specs.tertiary]
speed_car = 60
speed_moto = 60
lanes = 1

[highway_specs.residential]
speed_car = 60
speed_moto = 60
lanes = 1

[highway_specs.unclassified]
speed_car = 60
speed_moto = 60
lanes = 1

[highway_specs.service]
speed_car = 40
speed_moto = 40
lanes = 1

# 未列出的 highway 型別套用此預設
[highway_specs.default]
speed_car = 70
speed_moto = 70
lanes = 1

# UXsim 後端全域設定（僅 LLM_ABM_ENGINE=uxsim 時生效；見 docs/UXSIM_MIGRATION_zh-TW.md）
[uxsim]
deltan = 1                    # 平台聚合單位（1=每車獨立，個體 LLM 必需；成本 ∝ 1/deltan²）
jam_density = 0.2             # link 堵塞密度 veh/m/lane（FD 校準對象）
dev_crop_km = 0              # 本機開發裁切半徑（球場為心；0=全市。本機開發可設 8；env UXSIM_DEV_CROP_KM 可覆寫）
reaction_time = 1            # UXsim 跟車反應時間 s
route_choice_principle = "homogeneous_DUO"
duo_update_time = 1800        # 路徑重算間隔 s（調大=更省、改路更少）
duo_update_weight = 0.5      # 換到新最短路的強度 λ
duo_noise = 0.01             # 路徑選擇隨機擾動（調大=更分散）
route_choice_update_gradual = false
instantaneous_TT_timestep_interval = 5
no_cyclic_routing = true    # 禁止重複經過同節點（防繞圈）
hard_deterministic_mode = true  # 永遠走最短路、無隨機（可重現）
sparse_route_search = true   # 稀疏 route_search：DUO 的 all-pairs Dijkstra 改成只對實際終點算（結果一致、城市尺度大幅加速）；
                             # 搭配 [demand].dest_pool_per_capita。false=用 UXsim 原生 all-pairs（對拍/除錯）
vehicle_logging_interval = -1  # 記憶體關鍵：-1 關掉「每步每車」軌跡記錄（防 OOM；保留換 link 記錄供 readback/偵測器）。
                               # 預設值 1 在 7萬車城市尺度會吃爆 RAM。>1=折衷取樣（軌跡較不精細）
reduce_memory_route_pref = true  # 車抵達後刪除其 route_pref（再省記憶體）
